name: orders_app
description: "Cross-platform offline-first task dispatch, timer, and accountability application."
publish_to: 'none'
version: 1.1.0+13

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  crypto: ^3.0.3
  encrypt: ^5.0.3
  intl: ^0.19.0
  image_picker: ^1.1.2
  file_picker: ^12.0.0
  path_provider: ^2.1.3
  audioplayers: ^6.0.0
  mqtt_client: ^10.5.0
  image: ^4.2.0
  flutter_local_notifications: ^17.2.4
  flutter_foreground_task: ^11.0.1
  flutter_timezone: ^5.1.0
  timezone: ^0.9.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
