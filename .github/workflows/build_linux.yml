name: Build Linux & Steam Deck Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libasound2-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Linux Desktop Bundle
        run: flutter build linux --release

      - name: Package Linux Artifacts
        run: |
          mkdir -p dist
          tar -czvf dist/SubTaskManager-Linux-x64.tar.gz -C build/linux/x64/release/bundle .
          cp -r build/linux/x64/release/bundle dist/SubTaskManager-Linux-x64-bundle

      - name: Upload Linux Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubTaskManager-Linux-x64
          path: dist/SubTaskManager-Linux-x64.tar.gz
