name: Build Linux & macOS Releases

on:
  # A release pushes a commit, then creates a tag, and the release script used
  # to dispatch a third time - three runs of the same commit, two of them
  # racing to attach the same assets. The push is the one that matters; the
  # release script waits for it by commit.
  push:
    branches: [ main, master ]
    paths-ignore:
      # The manifest commit at the end of a release touches only these, and
      # nothing here is built from them.
      - 'website/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux Desktop Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Build Toolchain
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libasound2-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test

      - name: Compile Linux Native Release
        run: flutter build linux --release --no-tree-shake-icons

      - name: Package Linux Distributable Archive
        run: |
          mkdir -p dist
          tar -czvf dist/SubTaskManager-Linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Distributable
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Distributable
          path: dist/SubTaskManager-Linux-x64.tar.gz

  build-macos:
    name: Build macOS Desktop Release
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test

      - name: Compile macOS Native Release
        run: flutter build macos --release --no-tree-shake-icons

      - name: Package macOS App Bundle (.zip) & Disk Image (.dmg)
        run: |
          mkdir -p dist
          cd build/macos/Build/Products/Release
          zip -r -y ../../../../../dist/SubTaskManager-macOS.zip orders_app.app
          hdiutil create -volname "SubTask Manager" -srcfolder orders_app.app -ov -format UDZO ../../../../../dist/SubTaskManager-macOS.dmg

      - name: Upload macOS Distributable
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Distributable
          path: |
            dist/SubTaskManager-macOS.zip
            dist/SubTaskManager-macOS.dmg
