name: Build Linux & macOS Releases

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux Desktop Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Build Toolchain
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libasound2-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test

      - name: Compile Linux Native Release
        run: flutter build linux --release --no-tree-shake-icons

      - name: Package Linux Distributable Archive
        run: |
          mkdir -p dist
          tar -czvf dist/SubTaskManager-Linux-x64.tar.gz -C build/linux/x64/release/bundle .
          cp dist/SubTaskManager-Linux-x64.tar.gz dist/OrdersApp-Linux-x64.tar.gz

      - name: Upload Linux Distributable
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Distributable
          path: dist/*Linux-x64.tar.gz

  build-macos:
    name: Build macOS Desktop Release
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test

      - name: Compile macOS Native Release
        run: flutter build macos --release --no-tree-shake-icons

      - name: Package macOS App Bundle (.zip) & Disk Image (.dmg)
        run: |
          mkdir -p dist
          cd build/macos/Build/Products/Release
          zip -r -y ../../../../../dist/SubTaskManager-macOS.zip orders_app.app
          cp ../../../../../dist/SubTaskManager-macOS.zip ../../../../../dist/OrdersApp-macOS.zip
          hdiutil create -volname "SubTask Manager" -srcfolder orders_app.app -ov -format UDZO ../../../../../dist/SubTaskManager-macOS.dmg
          cp ../../../../../dist/SubTaskManager-macOS.dmg ../../../../../dist/OrdersApp-macOS.dmg

      - name: Upload macOS Distributable
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Distributable
          path: |
            dist/*macOS.zip
            dist/*macOS.dmg

  release:
    name: Publish GitHub Release (on tags)
    needs: [build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Consolidate distribution files
        run: |
          mkdir -p release_assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.dmg" \) -exec cp {} release_assets/ \;
          ls -la release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
