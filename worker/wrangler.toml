name = "subtask-push"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Account id is read from CLOUDFLARE_ACCOUNT_ID, which cloudflare_env.ps1
# already exports, so no account identifier lives in this file.

[vars]
# Firebase project id, e.g. "subtask-manager-1a2b3". Not a secret.
FCM_PROJECT_ID = "subtask-manager"

# Salted SHA-256 of each valid Patreon code, comma-separated - the same digests
# lib/core/security/patreon_access.dart checks. Change them together.
PATREON_CODE_DIGESTS = "41b8e53589df24f399069c68e060d25c9eac2c20eca096f8d6fc6a20ba99895e"

# The service-account JSON is a secret and is NOT set here. Load it with:
#   npx wrangler secret put FCM_SERVICE_ACCOUNT

[[d1_databases]]
binding = "DB"
database_name = "subtask-push-registry"
database_id = "c10bb87d-867e-442f-b3e0-81b6aef93f1e"

# Patreon early-access builds: latest.json, latest.json.sig and download/<file>,
# served only to requests carrying a valid Patreon code.
[[r2_buckets]]
binding = "PATREON_BUILDS"
bucket_name = "subtask-patreon-builds"

[[kv_namespaces]]
binding = "TOKEN_CACHE"
id = "b2662ab7352f46e5bed49c37560e1578"

# Evaluated every minute. Scheduled windows in this app are fifteen minutes or
# wider, so minute granularity is far more precision than they need - and
# infinitely more than a frozen foreground service was providing.
[triggers]
crons = ["* * * * *"]

# Retained invocation logs (dashboard > Workers > subtask-push > Logs). Without
# it, whatever the cron did at 3am is gone unless someone was running
# `wrangler tail` at the time.
[observability]
enabled = true

# Live delivery for devices FCM cannot reach (Windows, Linux, macOS). One hub
# per topic, holding each connected device's WebSocket plus a short backlog.
[[durable_objects.bindings]]
name = "TOPIC_HUB"
class_name = "TopicHub"

# SQLite-backed, which is what puts Durable Objects on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TopicHub"]
